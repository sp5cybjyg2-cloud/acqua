<style>
:root{--page:#fff;--ink:#000;--muted:#555;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

canvas{display:block;width:100%;height:100%}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;line-height:1.4;font-size:15px}

button:hover{background:var(--ink);color:var(--page)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label{display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--ink);width:120px}
.hint{color:var(--muted);font-size:14px;text-align:center}

      const p = ov[ax], ia = 1 / a.m, ib = 1 / b.m, s = ia + ib;
      a.x -= n[0] * p * ia / s; a.y -= n[1] * p * ia / s; a.z -= n[2] * p * ia / s;
      b.x += n[0] * p * ib / s; b.y += n[1] * p * ib / s; b.z += n[2] * p * ib / s;
      const vn = (b.vx - a.vx) * n[0] + (b.vy - a.vy) * n[1] + (b.vz - a.vz) * n[2];
      if (vn < 0){ const k = -1.9 * vn / s;
        a.vx -= k * n[0] * ia; a.vy -= k * n[1] * ia; a.vz -= k * n[2] * ia; b.vx += k * n[0] * ib; b.vy += k * n[1] * ib; b.vz += k * n[2] * ib; }
    }
    for (const t of texts) fence(t);
  }
  for (const o of imgs) [o.ex, o.ey] = ell(o);
  for (let it = 0; it < 4; it++){ // anche le immagini non si sovrappongono: si urtano e rimbalzano
    for (let i = 0; i < imgs.length; i++) for (let j = i + 1; j < imgs.length; j++){
      const a = imgs[i], b = imgs[j], Ax = a.ex + b.ex, Ay = a.ey + b.ey;
      let dx = b.x - a.x, dy = b.y - a.y, q = Math.hypot(dx / Ax, dy / Ay);
      if (q >= 1) continue;
      if (q < 0.02){ const t = rnd(0, TAU); dx = Math.cos(t) * Ax * 0.02; dy = Math.sin(t) * Ay * 0.02; q = 0.02; }
      const f = (1 / q - 1) / 2;
      a.x -= dx * f; a.y -= dy * f; b.x += dx * f; b.y += dy * f;
      let nx = dx / (Ax * Ax), ny = dy / (Ay * Ay); const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (vn < 0){ const k = -1.9 * vn / 2; a.vx -= k * nx; a.vy -= k * ny; b.vx += k * nx; b.vy += k * ny; }
    }
    for (const o of imgs) fence(o);
  }
}
function apply(){
  for (const t of texts){
    const e = Math.min(1, t.age / 30);
    t.T.mat.opacity = e; t.g.scale.setScalar(0.9 + 0.1 * e);
    t.g.position.set(t.x, t.y, t.z); t.g.rotation.set(t.r[0], t.r[1], t.r[2]);
  }
  for (const o of imgs){
    const e = 0.6 + 0.4 * Math.min(1, o.age / 40);
    o.mesh.scale.set(o.w * e, o.h * e, 1);
    o.g.position.set(o.x, o.y, o.z); o.g.rotation.set(o.r[0], o.r[1], o.r[2]);
  }
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(100, now - lastT || 16.7); lastT = now;
  if (!paused){ acc += dt; while (acc >= 16.667){ acc -= 16.667; T += 0.016; step(); } }
  apply();
  az += azV; el = clamp(el + elV, -1.45, 1.45); azV *= 0.94; elV *= 0.94;
  placeCam(); renderer.render(scene, camera);
}
function init(){
  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setPixelRatio(1); renderer.setSize(AW, AH, false); renderer.setClearColor(0xffffff, 1);
  document.getElementById('stage').appendChild(renderer.domElement);
  scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(FOV, AW / AH, 1, 8000);
  unitGeo = new THREE.PlaneGeometry(1, 1);
  for (const k in IMGS){
    const tex = new THREE.TextureLoader().load(IMGS[k].src); tex.anisotropy = 8;
    imgMat[k] = new THREE.MeshBasicMaterial({map: tex, side: THREE.DoubleSide, transparent: true, depthWrite: false,
      blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.ZeroFactor, blendDst: THREE.SrcColorFactor});
  }
  const cvs = renderer.domElement, ptrs = new Map(); let moved = 0;
  cvs.addEventListener('pointerdown', e => { cvs.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); moved = 0; azV = elV = 0; });
  cvs.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const sc = AW / cvs.clientWidth;
    if (ptrs.size === 1){
      const dx = (e.clientX - p.clientX) * sc, dy = (e.clientY - p.clientY) * sc; moved += Math.abs(dx) + Math.abs(dy);
      azV = -dx * 0.006; elV = dy * 0.006; az += azV; el = clamp(el + elV, -1.45, 1.45);
    } else if (ptrs.size === 2){
      const o = [...ptrs.values()].find(q => q.pointerId !== e.pointerId), d1 = Math.hypot(e.clientX - o.clientX, e.clientY - o.clientY), d0 = Math.hypot(p.clientX - o.clientX, p.clientY - o.clientY);
      if (d0 > 0 && d1 > 0) dist = clamp(dist * d0 / d1, 800, 6000); moved += 10;
    }
    ptrs.set(e.pointerId, e);
  });
  const up = e => { if (ptrs.size === 1 && moved < 8 * AW / cvs.clientWidth && e.type === 'pointerup') click(e); ptrs.delete(e.pointerId); };
  cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);
  cvs.addEventListener('wheel', e => { e.preventDefault(); dist = clamp(dist * Math.exp(e.deltaY * 0.001), 800, 6000); }, {passive: false});
  document.getElementById('ext').oninput = e => { depth = +e.target.value; setDepth(); };
  document.getElementById('bPause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Riprendi' : 'Pausa'; };
  document.getElementById('bRst').onclick = reset;
  cnt.textContent = '0 / ' + TEXTS.length;
  requestAnimationFrame(frame);
}
init();
</script>
